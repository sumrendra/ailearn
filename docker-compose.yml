version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ailearn-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3080}:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-admin}:${DB_PASSWORD:-epaps0991g}@${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/${DB_NAME:-ailearn}
      AUDIO_ROOT: /data/audio
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3080}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENROUTER_KEY: ${OPENROUTER_KEY}
      AUTH_TRUST_HOST: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/sumrendra/ailearn-audio:/data/audio:ro
